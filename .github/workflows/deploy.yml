name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_URL: https://${{ github.repository_owner }}.github.io
  BASE_PATH: /${{ github.event.repository.name }}
  PUBLIC_DRIVE_FOLDER_ID: ${{ vars.PUBLIC_DRIVE_FOLDER_ID }}
  PUBLIC_GOOGLE_DRIVE_API_KEY: ${{ vars.PUBLIC_GOOGLE_DRIVE_API_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar, compilar y subir artefacto
        uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
